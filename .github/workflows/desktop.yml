name: 軟體版

on:
  # 手動執行：打包三個平台的安裝檔，放在這次執行的 Artifacts
  workflow_dispatch:
  # 推送 v 開頭的標籤（例如 v0.1.0）：打包並建立草稿版 Release
  push:
    tags: ["v*"]
  # 修改軟體版程式時，跑 Rust 測試
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Rust 測試（含 LibreOffice 實際轉檔）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安裝系統套件
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libreoffice-writer libreoffice-calc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # tauri 編譯時會檢查前端輸出資料夾存在
      - run: mkdir -p apps/web/dist
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  build:
    name: 打包（${{ matrix.name }}）
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS（Intel 與 Apple 晶片通用）
            os: macos-latest
            args: "--target universal-apple-darwin"
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 Linux 系統套件
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # 只有推送標籤時才建立 Release（草稿，確認後再手動發佈）
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: PDF 工具箱 ${{ github.ref_name }}
          releaseBody: 下載對應作業系統的安裝檔。Office 轉 PDF 需要另外安裝免費的 LibreOffice。
          releaseDraft: true
      - name: 上傳安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Toolbox-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
